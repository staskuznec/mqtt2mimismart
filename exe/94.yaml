# Конфиг бинарника mqtt2mimismart.
#
# Ищется рядом с исполняемым файлом как 94.yaml; путь переопределяется
# переменной окружения SHELLY_CONFIG.
#
# Здесь нет ни одного реле — и не должно быть. Адрес устройства, учётные
# данные и адреса элементов умного дома приезжают в самой команде от скрипта:
#
#   192.168.20.222|on|0|state=524:248
#   shadow:misteR48@192.168.20.222|status|0|state=524:248|power=563:250|temp=563:247
#
# Поэтому при добавлении нового реле этот файл трогать не нужно: он ставится
# один раз на инсталляцию и описывает только подключение к серверу умного дома.

mimismart:
  addr: "127.0.0.1:9001"    # host:port сервера SHS
  key: "0123456789abcdef"   # ключ AES: ровно 16, 24 или 32 байта
  mac: ""                   # пусто — сгенерируется случайный mac-id

logging:
  level: error              # debug | info | warn | error
  format: text              # text | json

runtime:
  timeout_sec: 30            # общий watchdog процесса
  http_timeout_sec: 5        # таймаут запроса к реле
  dry: false                 # true — не слать в умный дом, только напечатать

  # Единственный источник состояния — периодический опрос из скрипта.
  # После команды on/off/toggle бинарник ничего не пишет: иначе получаются
  # две записи подряд, команда и опрос, и элемент в интерфейсе дёргается.
  report_after_action: false

  # Опрос отдаёт состояние целиком каждый раз, менялось оно или нет.
  # true включит фильтрацию неизменившихся значений и кэш рядом с конфигом.
  only_changed: false
