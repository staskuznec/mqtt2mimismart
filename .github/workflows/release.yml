name: Релиз

# Сборка идёт по тегу вида v0.1.0. Ветка сама по себе релиза не даёт: на
# объекте должно быть понятно, какая именно версия там стоит, а «последний
# коммит в main» таким ответом не является.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы создать релиз и приложить к нему файлы

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Форматирование
        run: test -z "$(gofmt -l . | grep -v '^docs/')" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
          - goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goarch: arm64
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          # SQLite взят чистый на Go, поэтому кросс-компиляция обходится без
          # тулчейна и собирается статически.
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$GITHUB_REF_NAME" ] && version="$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X main.version=$version" \
            -o "mqtt2mimismart-${{ matrix.suffix }}" ./cmd/gateway

      - uses: actions/upload-artifact@v7
        with:
          name: mqtt2mimismart-${{ matrix.suffix }}
          path: mqtt2mimismart-${{ matrix.suffix }}
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Тег должен стоять на main
        # Релиз собирается только из main: на объекте должно быть понятно, что
        # именно там стоит, а тег с ветки разработки такой гарантии не даёт.
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Тег $GITHUB_REF_NAME не входит в main — релиз не собираем." >&2
            exit 1
          }
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Контрольные суммы
        # Обновление на объекте скачивает бинарник по сети и запускает его
        # вместо себя. Без сверки суммы это означало бы «выполнить то, что
        # пришло», поэтому файл сумм обязателен.
        run: sha256sum mqtt2mimismart-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            mqtt2mimismart-*
            SHA256SUMS
            deploy/mqtt2mimismart.service
            deploy/mimisetup-mqtt-tab.js
            install.sh
          generate_release_notes: true
